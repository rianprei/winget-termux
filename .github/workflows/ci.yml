name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: termux/termux-docker:aarch64-noble
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Run tests
        run: ./run-tests.sh
