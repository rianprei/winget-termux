name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test inside termux-docker
        run: |
          docker run --rm -v "$PWD:/root/repo" -w /root/repo termux/termux-docker:latest \
            bash -lc "bash build.sh && bash run-tests.sh"
