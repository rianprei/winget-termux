name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb inside termux-docker
        run: |
          docker create --name wgbuild -v "$PWD:/root/repo:ro" termux/termux-docker:latest \
            bash -lc "mkdir -p \$HOME/repo && cp -r /root/repo/. \$HOME/repo && cd \$HOME/repo && bash build.sh && bash package.sh"
          docker start -a wgbuild
          docker cp wgbuild:/data/data/com.termux/files/home/repo/winget-termux_1.0.0_aarch64.deb .
          docker rm wgbuild

      - name: Checksums
        run: sha256sum winget-termux_*.deb > checksums.txt

      - name: Build release notes
        run: |
          DEB=$(ls winget-termux_*.deb)
          cat > notes.md <<EOF
          # winget on Android — real, native, no emulation

          A working subset of Microsoft's \`winget-cli\` compiled natively for
          ARM64/bionic Termux. No proot, no chroot, no root, no Wine, no
          emulation layer — this is the same clang toolchain and manifest/SQLite
          index format upstream winget uses, just targeting Android's libc.

          ## Highlights

          - \`install\` / \`uninstall\` / \`upgrade\` (single or \`--all\`) / \`search\` / \`show\` / \`list\` (with \`--upgrade-available\`)
          - \`source add/update/remove/list/export\` — sync remote SQLite catalogs
          - \`install-url\` — install a script or binary straight from a URL, hash computed from what was actually downloaded
          - \`pin\` / \`unpin\`, \`export\` / \`import\`, \`hash\`, \`validate\`, \`download\`, \`--info\`, \`complete\`
          - Portable, Zip, and Script installer types, real SHA256 verification, zip-slip and path-traversal hardened
          - Ships with a 19-package curated catalog of verified ARM64 CLI tools

          ## Install

          \`\`\`bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$DEB
          dpkg -i $DEB
          \`\`\`

          ## Or build from source

          \`\`\`bash
          git clone https://github.com/${{ github.repository }}.git
          cd $(basename ${{ github.repository }})
          ./build.sh
          \`\`\`

          ## Verify (sha256)

          \`\`\`
          $(cat checksums.txt)
          \`\`\`

          ## Docs

          [README](https://github.com/${{ github.repository }}#readme) ·
          [Architecture](https://github.com/${{ github.repository }}/blob/main/docs/ARCHITECTURE.md) ·
          [Catalog](https://github.com/${{ github.repository }}/blob/main/catalog/README.md) ·
          [Security policy](https://github.com/${{ github.repository }}/blob/main/SECURITY.md)

          ---

          **What's changed**
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: winget-termux ${{ github.ref_name }}
          body_path: notes.md
          files: |
            winget-termux_*.deb
            checksums.txt
          generate_release_notes: true
